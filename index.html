<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STICKBREAK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20232b;font:14px system-ui;display:grid;place-items:center;min-height:100dvh}#game{width:100vw;height:100dvh;min-height:0;background:white;display:flex;flex-direction:column;position:relative;overflow:hidden}header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;justify-content:space-between;align-items:center;z-index:2}#coins{font-size:19px;font-weight:800}button{cursor:pointer;border:0;border-radius:8px;padding:8px;font-weight:800}#room{position:relative;flex:1;touch-action:manipulation;overflow:hidden}canvas{width:100%;height:100%;display:block}#hpwrap{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;width:190px;font-weight:800}#hpbg{height:12px;border-radius:10px;background:#ddd;overflow:hidden;border:1px solid #a55}#hpbar{height:100%;width:100%;background:#e7474d}#ko{display:none;position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:52px;font-weight:1000;color:#ed3b41;text-shadow:2px 3px #ffce2e;white-space:nowrap}#reset{display:none;margin:auto;font-size:17px;background:#ffcd40}#shop{background:#f0f0f0;padding:9px 0 calc(10px + env(safe-area-inset-bottom))}#shoptitle{font-weight:900;padding:0 12px 6px}#items{display:flex;gap:7px;overflow-x:auto;padding:0 10px 5px;scrollbar-width:thin}.item{flex:0 0 103px;min-height:112px;background:#fff;border:2px solid #ddd;border-radius:11px;padding:6px;text-align:center;cursor:pointer}.item.equipped{border-color:#d8a100;background:#fff9dc}.emoji{font-size:25px}.name{font-size:11px;font-weight:900}.stat{font-size:11px;color:#555}.price{font-size:10px;font-weight:900;margin-top:5px}.item.locked{opacity:.7}#settings{position:absolute;inset:0;background:#fff;z-index:9;overflow:auto;padding:16px;display:none}#settings label{display:block;margin:10px 0;font-weight:700}#settings input{width:100%}#settings input[type=color]{height:35px}#settings h2{margin:0 0 12px}#settings button{background:#eee}#bossbar{display:flex;gap:7px;align-items:center;padding:5px 12px;background:#eee}#boss{flex:1;min-width:0;padding:7px;border-radius:8px;border:1px solid #ccc;background:white;font-weight:700}#bossbar span{font-weight:800;font-size:12px}#toast{position:absolute;top:45px;left:0;right:0;text-align:center;font-weight:900;pointer-events:none;color:#b07700}
</style></head><body><main id="game"><header><div id="coins">🪙 0</div><button id="config">⚙ Settings</button></header><div id="bossbar"><span>👑 BOSS</span><select id="boss"></select></div><section id="room"><canvas id="canvas"></canvas><div id="hpwrap"><div id="hpnum">1,000,000,000 HP</div><div id="hpbg"><div id="hpbar"></div></div></div><div id="ko">K.O.!<div><button id="reset">RESET</button></div></div><div id="toast"></div></section><section id="shop"><div id="shoptitle">WEAPONS</div><div id="items"></div></section><aside id="settings"><button id="close">✕ Close</button><h2>Settings</h2><label>Coins multiplier <input id="mult" type="number" min="1" max="100000" value="1"></label><label>Max HP <input id="maxhp" type="number" min="1" value="1000000000"></label><label>Screen shake <input id="shake" type="range" min="0" max="3" step=".1" value="1"></label><div id="colors"></div><button id="save">Save settings</button></aside></main>
<script>
const weapons=[['Fist','👊',0,1],['Wood Bat','🏏',50,3],['Katana','🗡️',200,8],['Sledgehammer','🔨',600,20],['Laser Sword','⚔️',1500,50],['Chainsaw','🪚',5000,150],['Rocket','🚀',15000,400],['Fire Axe','🪓',50000,1200],['Bomb','💣',150000,3500],['UFO Blaster','🛸',500000,10000],['Comet','☄️',2000000,30000],['Nuke','☢️',10000000,100000],['Plasma Cannon','🔫',50000000,300000],['Black Hole','⚫',250000000,1000000],['Galaxy','🌌',500000000,3000000]];
const extras=[];const themes=[['Training','🥊'],['Wood','🪵'],['Steel','🔩'],['Fire','🔥'],['Ice','❄️'],['Thunder','⚡'],['Shadow','🌑'],['Crystal','💎'],['Toxic','☣️'],['Cyber','🤖'],['Cosmic','🌠'],['Mythic','🐉']];const types=[['Gloves','🥊'],['Bat','🏏'],['Blade','🗡️'],['Hammer','🔨'],['Axe','🪓'],['Spear','🔱'],['Blaster','🔫'],['Orb','🔮'],['Meteor','☄️'],['Cannon','💥']];for(let a=0;a<themes.length;a++)for(let b=0;b<types.length;b++){const tierPower=[2,5,12,35,65,120,260,550,1100,2500,7000,18000];const typePower=[1,1.5,2,2.8,2.3,2.5,3.5,4,5,6];let damage=Math.max(1,Math.round(tierPower[a]*typePower[b])),price=Math.round(damage*(a<2?12:a<5?20:a<9?30:45));extras.push([themes[a][0]+' '+types[b][0],types[b][1],price,damage])}weapons.push(...extras);
const bosses=[['Classic Stickman',1000000000,'#111111',1],['Rookie Brawler',3000000000,'#3377bb',1.5],['Iron Giant',12000000000,'#64748b',2],['Crimson Champion',50000000000,'#c92e3c',3],['Toxic Titan',200000000000,'#36a667',4],['Frost King',1000000000000,'#48aee8',5],['Thunder Lord',5000000000000,'#8c61dc',6],['Shadow Assassin',25000000000000,'#272334',8],['Golden Emperor',100000000000000,'#d4a423',10],['Cosmic Guardian',1000000000000000,'#5b43c5',15],['Void Monarch',10000000000000000,'#181027',20],['Galaxy Destroyer',100000000000000000,'#ce49a2',30]];
const defaults={room:'#ffffff',stickman:'#111111',coins:'#f4b51c',starburst:'#ffcb22',hpbar:'#e7474d',cards:'#ffffff'};
let saved={};try{saved=JSON.parse(localStorage.getItem('stickbreak-save')||'{}')}catch(e){}
let coins=Number(saved.coins)||0,owned=Array.isArray(saved.owned)?saved.owned:[0],equipped=owned.includes(saved.equipped)?saved.equipped:0;
let opts={mult:1,maxhp:1000000000,shake:1,...defaults,...(saved.opts||{})},bossIndex=Math.max(0,Math.min(bosses.length-1,Number(saved.bossIndex)||0)),hp=Number.isFinite(saved.hp)?saved.hp:bosses[bossIndex][1];
bosses[0][1]=opts.maxhp;const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),room=$('room');let W=375,H=330,tilt=0,velocity=0,hitTime=0,side=1,particles=[],floaters=[],shake=0,last=performance.now(),audio=null,koPlayed=false;
$('boss').innerHTML=bosses.map((b,i)=>'<option value="'+i+'">'+b[0]+' · '+(i+1)+'</option>').join('');$('boss').value=bossIndex;$('boss').onchange=()=>{bossIndex=Number($('boss').value);hp=bosses[bossIndex][1];tilt=velocity=0;refresh();persist()};
const fmt=n=>Math.floor(n).toLocaleString('en-US');function persist(){localStorage.setItem('stickbreak-save',JSON.stringify({coins,owned,equipped,hp,opts,bossIndex}))}
function sound(freq=180,duration=.09,type='sine',vol=.12){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.55),audio.currentTime+duration);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function haptic(n){if(navigator.vibrate)navigator.vibrate(n)}
function refresh(){ $('coins').textContent='🪙 '+fmt(coins);$('hpnum').textContent=fmt(Math.max(0,hp))+' HP';$('hpbar').style.width=(Math.max(0,hp)/bosses[bossIndex][1]*100)+'%';$('hpbar').style.background=opts.hpbar;$('ko').style.display=hp<=0?'block':'none';$('reset').style.display=hp<=0?'inline-block':'none';$('items').innerHTML=weapons.map((w,i)=>'<div class="item '+(equipped===i?'equipped ':'')+(!owned.includes(i)?'locked':'')+'" data-i="'+i+'" style="background:'+opts.cards+'"><div class="emoji">'+w[1]+'</div><div class="name">'+w[0]+'</div><div class="stat">+'+fmt(w[3])+' / hit</div><div class="price">'+(equipped===i?'EQUIPPED':owned.includes(i)?'EQUIP':'🪙 '+fmt(w[2]))+'</div></div>').join('')}
function toast(s){$('toast').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',1100)}
$('items').addEventListener('click',e=>{let card=e.target.closest('[data-i]');if(!card)return;let i=+card.dataset.i,w=weapons[i];if(!owned.includes(i)){if(coins<w[2]){toast('Not enough coins!');sound(120);return}coins-=w[2];owned.push(i);sound(620,.2);haptic(50)}equipped=i;refresh();persist()});
function burst(n,x,y){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:45+Math.random()*25,r:2+Math.random()*3})}}
function attack(){if(hp<=0)return;let damage=weapons[equipped][3],earned=damage*Number(opts.mult||1)*bosses[bossIndex][3];hp=Math.max(0,hp-damage);coins+=earned;side*=-1;velocity+=side*Math.min(.45,.13+Math.log10(damage+1)*.04);hitTime=performance.now();shake=(2+Math.log10(damage+1)*2)*opts.shake;burst(Math.min(28,8+Math.floor(Math.log10(damage+1)*3)),W/2,H*.52);floaters.push({x:W/2+Math.random()*40-20,y:H*.45,text:'+'+fmt(earned)+' 🪙',life:65});sound(100+Math.min(230,damage/100),.13,'triangle');setTimeout(()=>sound(750,.07,'sine',.05),75);haptic(12);if(hp<=0){sound(75,.45,'sawtooth',.15);haptic([100,50,150]);burst(40,W/2,H*.5)}refresh();persist()}
room.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;attack()});$('reset').onclick=()=>{hp=bosses[bossIndex][1];tilt=velocity=0;koPlayed=false;refresh();persist()};
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(canvas);
function line(x,y,x2,y2,width=5,color=bossIndex?bosses[bossIndex][2]:opts.stickman){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(t){let dt=Math.min(2,(t-last)/16.67);last=t;velocity-=tilt*.08*dt;velocity*=Math.pow(.84,dt);tilt+=velocity*dt;tilt=Math.max(-1.4,Math.min(1.4,tilt));let big=weapons[equipped][3]>=1200,hit=t-hitTime<220,bob=Math.sin(t/470)*3,ko=hp<=0;ctx.save();ctx.clearRect(0,0,W,H);ctx.fillStyle=opts.room;ctx.fillRect(0,0,W,H);let floor=H*.85;line(0,floor,W,floor,1.5,'#ddd');line(0,H,W/2,floor,1,'#e9e9e9');line(W,H,W/2,floor,1,'#e9e9e9');ctx.fillStyle='#00000015';ctx.beginPath();ctx.ellipse(W/2,floor,45,9,0,0,Math.PI*2);ctx.fill();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82;let cx=W/2,cy=floor-78+bob;ctx.save();ctx.translate(cx,cy);ctx.rotate(ko?Math.PI/2:tilt*.65);let arm=Math.sin(t/230)*.12+(hit?side*.65:0);line(0,-30,0,25,6);line(0,-20,-29,5+arm*16,5);line(0,-20,29,5-arm*16,5);line(0,25,-25,72,5);line(0,25,25,72,5);ctx.fillStyle=bossIndex?bosses[bossIndex][2]:opts.stickman;ctx.beginPath();ctx.arc(0,-53,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';if(hit&&big){line(-12,-58,-5,-51,2,'#fff');line(-5,-58,-12,-51,2,'#fff');line(5,-58,12,-51,2,'#fff');line(12,-58,5,-51,2,'#fff')}else{ctx.beginPath();ctx.arc(-8,-55,2.8,0,7);ctx.arc(8,-55,2.8,0,7);ctx.fill()}if(hit){ctx.fillStyle=opts.starburst;ctx.beginPath();let n=10,R=20+Math.log10(weapons[equipped][3]+1)*5;for(let i=0;i<n*2;i++){let a=i*Math.PI/n,r=i%2?R*.45:R;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();}if(ko){ctx.font='22px system-ui';ctx.fillStyle=opts.starburst;for(let i=0;i<3;i++)ctx.fillText('★',Math.cos(t/300+i*2.1)*35,-60+Math.sin(t/300+i*2.1)*18)}ctx.restore();if(hit){let progress=Math.min(1,(t-hitTime)/220);ctx.save();ctx.translate(cx,cy);ctx.globalAlpha=1-progress*.4;ctx.font=(32+Math.min(30,Math.log10(weapons[equipped][3]+1)*3))+'px system-ui';ctx.textAlign='center';ctx.translate(side*(110-110*Math.sin(progress*Math.PI/2)), -10-15*Math.sin(progress*Math.PI));ctx.rotate(side*(1-progress)*.9);if(equipped===0){ctx.font='48px system-ui';ctx.fillText(side>0?'🤛':'🤜',0,12)}else{ctx.fillText(weapons[equipped][1],0,0)}ctx.restore()}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=dt;ctx.fillStyle=opts.coins;ctx.globalAlpha=Math.min(1,p.life/15);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.font='bold 16px system-ui';ctx.fillStyle='#c89000';for(let f of floaters){f.y-=.65*dt;f.life-=dt;ctx.globalAlpha=Math.min(1,f.life/20);ctx.fillText(f.text,f.x-15,f.y)}floaters=floaters.filter(f=>f.life>0);ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
$('config').onclick=()=>{$('settings').style.display='block'};$('close').onclick=()=>{$('settings').style.display='none'};const colors=$('colors');for(let [k,v] of Object.entries(defaults))colors.innerHTML+='<label>'+k+' <input type="color" id="color-'+k+'" value="'+(opts[k]||v)+'"></label>';function sync(){for(let k of ['mult','maxhp','shake'])$(k).value=opts[k];for(let k of Object.keys(defaults))$('color-'+k).value=opts[k]}sync();$('save').onclick=()=>{let old=opts.maxhp;for(let k of ['mult','maxhp','shake'])opts[k]=Math.max(k==='shake'?0:1,Number($(k).value)||1);for(let k of Object.keys(defaults))opts[k]=$('color-'+k).value;if(old!==opts.maxhp&&bossIndex===0){bosses[0][1]=opts.maxhp;hp=opts.maxhp};$('settings').style.display='none';refresh();persist()};refresh();
</script></body></html>
