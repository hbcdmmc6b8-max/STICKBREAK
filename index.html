const extras=[];const themes=[['Training','🥊'],['Wood','🪵'],['Steel','🔩'],['Fire','🔥'],['Ice','❄️'],['Thunder','⚡'],['Shadow','🌑'],['Crystal','💎'],['Toxic','☣️'],['Cyber','🤖'],['Cosmic','🌠'],['Mythic','🐉']];const types=[['Gloves','🥊'],['Bat','🏏'],['Blade','🗡️'],['Hammer','🔨'],['Axe','🪓'],['Spear','🔱'],['Blaster','🔫'],['Orb','🔮'],['Meteor','☄️'],['Cannon','💥']];for(let a=0;a<themes.length;a++)for(let b=0;b<types.length;b++){const tierPower=[2,5,12,35,65,120,260,550,1100,2500,7000,18000];const typePower=[1,1.5,2,2.8,2.3,2.5,3.5,4,5,6];let damage=Math.max(1,Math.round(tierPower[a]*typePower[b])),price=Math.round(damage*(a<2?12:a<5?20:a<9?30:45));extras.push([themes[a][0]+' '+types[b][0],types[b][1],price,damage])}weapons.push(...extras);

e(side*(75-47*Math.sin(Math.min(1,progress*2)*Math.PI/2)), -10-8*Math.sin(progress*Math.PI));ctx.rotate(side*(1-progress)*.9);if(equipped===0){ctx.font='bold 30px Apple Color Emoji,Segoe UI Emoji,system-ui';ctx.fillText(side>0?'🤛':'🤜',0,8)}else{ctx.fillText(weapons[equipped][1],0,0)}ctx.restore()}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=dt;ctx.fillStyle=opts.coins;ctx.globalAlpha=Math.min(1,p.life/15);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.font='bold 16px system-ui';ctx.fillStyle='#c89000';for(let f of floaters){f.y-=.65*dt;f.life-=dt;ctx.globalAlpha=Math.min(1,f.life/20);ctx.fillText(f.text,f.x-15,f.y)}floaters=floaters.filter(f=>f.life>0);ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
$('config').onclick=()=>{$('settings').style.display='block'};$('close').onclick=()=>{$('settings').style.display='none'};const colors=$('colors');for(let [k,v] of Object.entries(defaults))colors.innerHTML+='<label>'+k+' <input type="color" id="color-'+k+'" value="'+(opts[k]||v)+'"></label>';function sync(){for(let k of ['mult','maxhp','shake'])$(k).value=opts[k];for(let k of Object.keys(defaults))$('color-'+k).value=opts[k]}sync();$('save').onclick=()=>{let old=opts.maxhp;for(let k of ['mult','maxhp','shake'])opts[k]=Math.max(k==='shake'?0:1,Number($(k).value)||1);for(let k of Object.keys(defaults))opts[k]=$('color-'+k).value;if(old!==opts.maxhp&&bossIndex===0){bosses[0][1]=opts.maxhp;hp=opts.maxhp};$('settings').style.display='none';refresh();persist()};refresh();
