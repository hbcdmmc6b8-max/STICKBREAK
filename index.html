/* Single stable layout: prevent collisions at all viewport sizes */

<script>
const music=new Audio('13%20-%20C418%20-%20Wet%20Hands.mp3');music.loop=true;music.volume=.35;let musicOn=false;document.getElementById('musicToggle').onclick=async()=>{musicOn=!musicOn;if(musicOn){try{await music.play()}catch(e){musicOn=false;alert('Upload beautiful-life.mp3 to the repository to enable music.')}}else music.pause();document.getElementById('musicToggle').textContent=musicOn?' Music: On':' Music: Off'};
const weapons=[['Fist','',0,1],['Wood Bat','',50,3],['Katana','',200,8],['Sledgehammer','',600,20],['Laser Sword','',1500,50],['Chainsaw','',5000,150],['Rocket','',15000,400],['Fire Axe','',50000,1200],['Bomb','',150000,3500],['UFO Blaster','',500000,10000],['Comet','',2000000,30000],['Nuke','',10000000,100000],['Plasma Cannon','',50000000,300000],['Black Hole','',250000000,1000000],['Galaxy','',500000000,3000000]];
const extras=[];const themes=[['Training',''],['Wood',''],['Steel',''],['Fire',''],['Ice',''],['Thunder',''],['Shadow',''],['Crystal',''],['Toxic',''],['Cyber',''],['Cosmic',''],['Mythic','']];const types=[['Gloves',''],['Bat',''],['Blade',''],['Hammer',''],['Axe',''],['Spear',''],['Blaster',''],['Orb',''],['Meteor',''],['Cannon','']];for(let a=0;a<themes.length;a++)for(let b=0;b<types.length;b++){const tierPower=[2,5,12,35,65,120,260,550,1100,2500,7000,18000];const typePower=[1,1.5,2,2.8,2.3,2.5,3.5,4,5,6];let damage=Math.max(1,Math.round(tierPower[a]*typePower[b])),price=Math.round(damage*(a<2?12:a<5?20:a<9?30:45));extras.push([themes[a][0]+' '+types[b][0],types[b][1],price,damage])}weapons.push(...extras);
const bosses=[['Classic Stickman',1000000000,'#111111',1],['Rookie Brawler',3000000000,'#3377bb',1.5],['Iron Giant',12000000000,'#64748b',2],['Crimson Champion',50000000000,'#c92e3c',3],['Toxic Titan',200000000000,'#36a667',4],['Frost King',1000000000000,'#48aee8',5],['Thunder Lord',5000000000000,'#8c61dc',6],['Shadow Assassin',25000000000000,'#272334',8],['Golden Emperor',100000000000000,'#d4a423',10],['Cosmic Guardian',1000000000000000,'#5b43c5',15],['Void Monarch',10000000000000000,'#181027',20],['Galaxy Destroyer',100000000000000000,'#ce49a2',30]];
const defaults={room:'#ffffff',stickman:'#111111',coins:'#f4b51c',starburst:'#ffcb22',hpbar:'#e7474d',cards:'#ffffff'};
let saved={};try{saved=JSON.parse(localStorage.getItem('stickbreak-save')||'{}')}catch(e){}
let coins=Number(saved.coins)||0,owned=Array.isArray(saved.owned)?saved.owned:[0],equipped=owned.includes(saved.equipped)?saved.equipped:0;
let opts={mult:1,maxhp:1000000000,shake:1,...defaults,...(saved.opts||{})},unlockedBoss=Math.max(0,Math.min(bosses.length-1,Number(saved.unlockedBoss)||0)),bossIndex=Math.max(0,Math.min(unlockedBoss,Number(saved.bossIndex)||0)),hp=Number.isFinite(saved.hp)?saved.hp:bosses[bossIndex][1];
bosses[0][1]=opts.maxhp;const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),room=$('room');let W=375,H=330,tilt=0,velocity=0,hitTime=0,side=1,particles=[],floaters=[],shake=0,last=performance.now(),audio=null,koPlayed=false;
$('boss').innerHTML=bosses.map((b,i)=>'<option value="'+i+'">'+b[0]+' · '+(i+1)+'</option>').join('');$('boss').value=bossIndex;$('boss').onchange=()=>{let target=Number($('boss').value);if(target>unlockedBoss){toast('Defeat the previous boss first!');updateBossNav();return}bossIndex=target;hp=bosses[bossIndex][1];tilt=velocity=0;refresh();persist()};
function updateBossNav(){ $('bossLabel').textContent='BOSS '+(bossIndex+1)+'/'+bosses.length;$('bossName').textContent='BOSS '+(bossIndex+1)+' — '+bosses[bossIndex][0].toUpperCase();$('bossDots').innerHTML=bosses.map((_,i)=>'<i class="'+(i===bossIndex?'active':'')+'"></i>').join('');$('boss').value=bossIndex;$('nextBoss').disabled=bossIndex>=bosses.length-1;$('prevBoss').disabled=bossIndex===0;$('bossDots').querySelectorAll('i').forEach((dot,i)=>{if(i>unlockedBoss)dot.classList.add('locked')})}function switchBoss(delta){let target=bossIndex+delta;if(target<0||target>=bosses.length)return;if(target>unlockedBoss){toast('LOCKED — Defeat this boss first');sound(130,.12);return}bossIndex=target;hp=bosses[bossIndex][1];tilt=velocity=0;refresh();persist()}$('prevBoss').onclick=()=>switchBoss(-1);$('nextBoss').onclick=()=>switchBoss(1);updateBossNav();const fmt=n=>Math.floor(n).toLocaleString('en-US');function persist(){localStorage.setItem('stickbreak-save',JSON.stringify({coins,owned,equipped,hp,opts,bossIndex,unlockedBoss}))}
function sound(freq=180,duration=.09,type='sine',vol=.12){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.55),audio.currentTime+duration);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function haptic(n){if(navigator.vibrate)navigator.vibrate(n)}
function refresh(){const shopScroll=$('items').scrollLeft; updateBossNav();$('coins').textContent='COINS  '+fmt(coins);$('hpnum').textContent=fmt(Math.max(0,hp))+' HP';$('hpbar').style.width=(Math.max(0,hp)/bosses[bossIndex][1]*100)+'%';$('hpbar').style.background=opts.hpbar;$('ko').style.display=hp<=0?'block':'none';$('reset').style.display=hp<=0?'inline-block':'none';$('items').innerHTML=weapons.map((w,i)=>'<div class="item '+(equipped===i?'equipped ':'')+(!owned.includes(i)?'locked':'')+'" data-i="'+i+'" style="background:'+opts.cards+'"><div class="emoji">'+w[1]+'</div><div class="name">'+w[0]+'</div><div class="stat">+'+fmt(w[3])+' /hit</div><div class="price">'+(equipped===i?'EQUIPPED':owned.includes(i)?'EQUIP':fmt(w[2])+' coins')+'</div></div>').join('');$('items').scrollLeft=shopScroll;renderShopIcons()}
function toast(s){$('toast').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',1100)}
$('items').addEventListener('click',e=>{let card=e.target.closest('[data-i]');if(!card)return;let i=+card.dataset.i,w=weapons[i];if(!owned.includes(i)){if(coins<w[2]){toast('Not enough coins!');sound(120);return}coins-=w[2];owned.push(i);sound(620,.2);haptic(50)}equipped=i;refresh();persist()});
function burst(n,x,y){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:45+Math.random()*25,r:2+Math.random()*3})}}
function attack(){if(hp<=0)return;let damage=weapons[equipped][3],earned=damage*Number(opts.mult||1)*bosses[bossIndex][3];hp=Math.max(0,hp-damage);coins+=earned;side*=-1;velocity+=side*Math.min(.45,.13+Math.log10(damage+1)*.04);hitTime=performance.now();shake=(2+Math.log10(damage+1)*2)*opts.shake;burst(Math.min(28,8+Math.floor(Math.log10(damage+1)*3)),W/2,H*.52);floaters.push({x:W/2+Math.random()*40-20,y:H*.45,text:'+'+fmt(earned)+' ',life:65});sound(100+Math.min(230,damage/100),.13,'triangle');setTimeout(()=>sound(750,.07,'sine',.05),75);haptic(12);if(hp<=0){if(bossIndex===unlockedBoss&&unlockedBoss<bosses.length-1){unlockedBoss++;toast('NEXT BOSS UNLOCKED!')}sound(75,.45,'sawtooth',.15);haptic([100,50,150]);burst(40,W/2,H*.5)}refresh();persist()}

function draw(t){let dt=Math.min(2,(t-last)/16.67);last=t;velocity-=tilt*.08*dt;velocity*=Math.pow(.84,dt);tilt+=velocity*dt;tilt=Math.max(-1.4,Math.min(1.4,tilt));let big=weapons[equipped][3]>=1200,hit=t-hitTime<220,bob=Math.sin(t/470)*3,ko=hp<=0;ctx.save();ctx.clearRect(0,0,W,H);ctx.fillStyle=opts.room;ctx.fillRect(0,0,W,H);let wall=ctx.createLinearGradient(0,0,0,H);wall.addColorStop(0,opts.room||'#fafafa');wall.addColorStop(.65,'#fafafa');wall.addColorStop(1,'#ededed');ctx.fillStyle=wall;ctx.fillRect(0,0,W,H);let floor=H*.88;line(0,floor,W,floor,1.5,'#ddd');line(W*.34,H,0,0,1,'#e2e2e2');line(W*.66,H,W,0,1,'#e2e2e2');ctx.fillStyle='#00000020';ctx.beginPath();ctx.ellipse(W/2,floor,45*Math.min(1.65,Math.max(.78,H/330)),9,0,0,Math.PI*2);ctx.fill();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82;let scale=Math.min(1.45,Math.max(.85,H/350)),cx=W/2,cy=floor-78*scale+bob;ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.rotate(ko?Math.PI/2:tilt*.65);let arm=Math.sin(t/230)*.12+(hit?side*.65:0);line(0,-30,0,25,6);line(0,-20,-29,5+arm*16,5);line(0,-20,29,5-arm*16,5);line(0,25,-25,72,5);line(0,25,25,72,5);ctx.fillStyle='#fff';ctx.strokeStyle=bossIndex?bosses[bossIndex][2]:opts.stickman;ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,-53,23,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=bossIndex?bosses[bossIndex][2]:opts.stickman;if(hit&&big){line(-12,-58,-5,-51,2);line(-5,-58,-12,-51,2);line(5,-58,12,-51,2);line(12,-58,5,-51,2)}else{ctx.beginPath();ctx.arc(-8,-55,2.8,0,7);ctx.arc(8,-55,2.8,0,7);ctx.fill()}if(hit){ctx.fillStyle=opts.starburst;ctx.beginPath();let n=10,R=20+Math.log10(weapons[equipped][3]+1)*5;for(let i=0;i<n*2;i++){let a=i*Math.PI/n,r=i%2?R*.45:R;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();}if(ko){ctx.fillStyle=opts.starburst;for(let i=0;i<3;i++){let a=t/300+i*2.1,x=Math.cos(a)*35,y=-60+Math.sin(a)*18;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();for(let j=0;j<10;j++){let q=j*Math.PI/5,r
